<header class="site-header">
  <div class="wrap header-inner">
    <a class="mark-link" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }} — home">
      <svg class="mark" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="17" cy="21" r="3.2" fill="var(--sun)"/>
        <path d="M17 21 A9 9 0 0 1 8.2 12.6" stroke="var(--moss)" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M17 21 A14 14 0 0 1 3.4 10.1" stroke="var(--blueprint)" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
        <path d="M17 21 A19.5 19.5 0 0 1 -1 8.6" stroke="var(--ink)" stroke-width="1.1" stroke-linecap="round" opacity="0.35" transform="translate(1,0)"/>
      </svg>
    </a>
    <div class="header-text">
      <a class="site-title" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
      <span class="site-tagline">{{ .Site.Params.tagline }}</span>
    </div>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}" {{ if eq $.RelPermalink .URL }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
